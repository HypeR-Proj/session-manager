bin = [{name = "hyper-session-manager", path = "src/main.rs", test = false, bench = false}]

[package]
name = "hyper-session-manager"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/session-manager"
publish = false

[features]
test-service-failure = []

[dependencies]

[dependencies.hyper-os]
version = "=0.0.0"

[dependencies.hyper-rt]
version = "=0.0.0"
features = ["std"]

[dependencies.hyper-service]
path = "../../lib/service"

[dependencies.hyper-component]
path = "../../lib/component"

[dependencies.hyper-service-ipc]
path = "../../lib/service-ipc"

[dependencies.hyper-journal]
path = "../../lib/journal"

[dependencies.hyper-terminal]
path = "../../lib/terminal"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]

[workspace]
resolver = "3"
members = []

[profile]

[profile.release]
codegen-units = 1
debug = 1
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = "none"
