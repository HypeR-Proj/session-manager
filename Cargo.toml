bin = [{name = "hyper-session-manager", path = "src/main.rs", test = false, bench = false}]

[package]
name = "hyper-session-manager"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/session-manager"
publish = false
workspace = "../../app"

[features]
test-service-failure = []

[dependencies]

[dependencies.hyper-os]
workspace = true

[dependencies.hyper-rt]
workspace = true
features = ["std"]

[dependencies.hyper-service]
workspace = true

[dependencies.hyper-component]
workspace = true

[dependencies.hyper-service-ipc]
workspace = true

[dependencies.hyper-journal]
workspace = true

[dependencies.hyper-terminal]
version = "=0.0.0"
path = "../../lib/terminal"

[dependencies.serde]
workspace = true
features = ["derive"]

[dependencies.serde_json]
workspace = true

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]
